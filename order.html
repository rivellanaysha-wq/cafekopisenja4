<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesan — Kopi Senja</title><meta name="description" content="Kopi Senja: cafe cozy di Jalan Diponegoro, Madiun. Kopi, WFC, dan sore yang pelan."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="order"><main>
<section class="page-hero wrap"><span class="eyebrow">Pesan</span><h1>Pesan <em>sekarang.</em></h1></section>
<section class="wrap" style="padding-bottom:6rem"><div class="ogrid"><div id="olist"></div>

</main><script src="js/script.js"></script></body></html>
